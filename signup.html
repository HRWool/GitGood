<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up · Git Good</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div class="stage"><div class="device"><div class="screen">
  <header class="appbar tall">
    <div class="row"><a class="back" href="index.html" data-back>‹</a><div class="steps grow"><i class="on"></i><i></i><i></i></div></div>
    <h1 style="margin-top:14px">Create your account</h1>
    <p class="sub">Step 1 of 3 · UNCC students only</p>
  </header>

  <form class="content" id="form" novalidate>
    <div class="field">
      <label for="email">UNCC email</label>
      <input class="input" id="email" type="email" placeholder="you@charlotte.edu" autocomplete="email">
      <div class="err" id="email-err"></div>
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input class="input" id="pw" type="password" placeholder="At least 8 characters" autocomplete="new-password">
      <div class="err" id="pw-err"></div>
    </div>
    <div class="field">
      <label for="user">Username</label>
      <input class="input" id="user" type="text" placeholder="e.g. maya_codes" maxlength="18" autocomplete="username">
      <div class="err" id="user-err"></div>
    </div>
    <div class="field">
      <label>Pick your avatar</label>
      <div class="avatar-pick" id="avatars"></div>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
    <p class="tiny muted center">🔒 Passwords are stored hashed (NFR-3). Your email is only used to confirm you're a Niner.</p>
  </form>
</div></div></div>

<script src="js/data.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script>
  const { $ } = GG;
  let avatar = AVATARS[0];
  $("#avatars").innerHTML = AVATARS.map((a, i) => `<button type="button" class="${i === 0 ? "on" : ""}" data-a="${a}" aria-label="Avatar ${a}">${a}</button>`).join("");
  $("#avatars").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    GG.$$("#avatars button").forEach((x) => x.classList.toggle("on", x === b));
    avatar = b.dataset.a;
  });

  // FR-1.1: only UNCC addresses. Students now get @charlotte.edu; legacy @uncc.edu also accepted.
  const UNCC = /^[^\s@]+@(charlotte|uncc)\.edu$/i;
  function check(el, errEl, ok, msg) {
    el.classList.toggle("bad", !ok);
    errEl.textContent = ok ? "" : msg;
    return ok;
  }
  $("#form").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = $("#email").value.trim(), pw = $("#pw").value, user = $("#user").value.trim();
    const okEmail = check($("#email"), $("#email-err"), UNCC.test(email),
      email ? "Git Good is for Niners only — use your @charlotte.edu or @uncc.edu email." : "Enter your UNCC email.");
    const okPw = check($("#pw"), $("#pw-err"), pw.length >= 8, "Use at least 8 characters.");
    const okUser = check($("#user"), $("#user-err"), /^[a-z0-9_]{3,18}$/i.test(user), "3–18 letters, numbers or underscores.");
    if (!(okEmail && okPw && okUser)) return;
    GG.startFresh({ email, username: user, name: "", avatar });
    location.href = "skills.html";
  });
</script>
</body>
</html>
