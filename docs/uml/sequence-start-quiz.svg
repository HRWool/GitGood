<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif}.life{stroke:#9aaba4;stroke-dasharray:6 5}.msg{stroke:#345b4d;stroke-width:2}.reply{stroke:#71817b;stroke-width:1.8;stroke-dasharray:7 5}</style><text x="50" y="48" font-family="Arial, sans-serif" font-size="27" fill="#073d30" font-weight="bold">Start an Assignment or Quiz - Sequence Diagram</text><text x="50" y="76" font-family="Arial, sans-serif" font-size="14" fill="#52645d" font-weight="normal">Target-state flow from the user story; the current prototype has no backend.</text><rect x="15" y="105" width="250" height="64" rx="8" fill="#e6f0ec" stroke="#7b9b8c"/><text x="140" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#174d3d">Student</text><line class="life" x1="140" y1="169" x2="140" y2="1220"/><rect x="375" y="105" width="250" height="64" rx="8" fill="#e6f0ec" stroke="#7b9b8c"/><text x="500" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#174d3d">Application Interface</text><line class="life" x1="500" y1="169" x2="500" y2="1220"/><rect x="735" y="105" width="250" height="64" rx="8" fill="#e6f0ec" stroke="#7b9b8c"/><text x="860" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#174d3d">Quest Service</text><line class="life" x1="860" y1="169" x2="860" y2="1220"/><rect x="1095" y="105" width="250" height="64" rx="8" fill="#e6f0ec" stroke="#7b9b8c"/><text x="1220" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#174d3d">Prisma Client / ORM</text><line class="life" x1="1220" y1="169" x2="1220" y2="1220"/><rect x="1455" y="105" width="250" height="64" rx="8" fill="#e6f0ec" stroke="#7b9b8c"/><text x="1580" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#174d3d">PostgreSQL</text><line class="life" x1="1580" y1="169" x2="1580" y2="1220"/><rect x="850" y="280" width="20" height="800" fill="#d5e8df" stroke="#7b9b8c"/><rect x="1210" y="390" width="20" height="580" fill="#e8eaf5" stroke="#9299b5"/><line class="msg" x1="140" y1="220" x2="500" y2="220"/><path d="M490,214 L500,220 L490,226 Z" fill="#345b4d"/><rect x="130" y="197" width="380" height="20" fill="#fff" opacity=".95"/><text x="320" y="212" text-anchor="middle" font-size="14" fill="#25343b">Select quest and press Start</text><line class="msg" x1="500" y1="290" x2="860" y2="290"/><path d="M850,284 L860,290 L850,296 Z" fill="#345b4d"/><rect x="490" y="267" width="380" height="20" fill="#fff" opacity=".95"/><text x="680" y="282" text-anchor="middle" font-size="14" fill="#25343b">startQuest(studentId, questId)</text><line class="msg" x1="860" y1="390" x2="1220" y2="390"/><path d="M1210,384 L1220,390 L1210,396 Z" fill="#345b4d"/><rect x="850" y="367" width="380" height="20" fill="#fff" opacity=".95"/><text x="1040" y="382" text-anchor="middle" font-size="14" fill="#25343b">findUnique(Student) and findUnique(Quest)</text><line class="msg" x1="1220" y1="470" x2="1580" y2="470"/><path d="M1570,464 L1580,470 L1570,476 Z" fill="#345b4d"/><rect x="1210" y="447" width="380" height="20" fill="#fff" opacity=".95"/><text x="1400" y="462" text-anchor="middle" font-size="14" fill="#25343b">SELECT Student and Quest</text><line class="reply" x1="1580" y1="540" x2="1220" y2="540"/><path d="M1228,535 L1220,540 L1228,545" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="1210" y="517" width="380" height="20" fill="#fff" opacity=".95"/><text x="1400" y="532" text-anchor="middle" font-size="14" fill="#25343b">Student and Quest records</text><line class="reply" x1="1220" y1="610" x2="860" y2="610"/><path d="M868,605 L860,610 L868,615" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="850" y="587" width="380" height="20" fill="#fff" opacity=".95"/><text x="1040" y="602" text-anchor="middle" font-size="14" fill="#25343b">Student and Quest</text><rect x="525" y="660" width="1215" height="550" rx="5" fill="#fff" stroke="#65766f" stroke-width="1.5"/><path d="M525,690 h70 v-28 h115" fill="#fff" stroke="#65766f" stroke-width="1.5"/><text x="535" y="682" font-family="Arial, sans-serif" font-size="13" fill="#25343b" font-weight="bold">alt</text><text x="620" y="682" font-family="Arial, sans-serif" font-size="13" fill="#25343b" font-weight="normal">[student and quest exist]</text><line class="msg" x1="860" y1="750" x2="1220" y2="750"/><path d="M1210,744 L1220,750 L1210,756 Z" fill="#345b4d"/><rect x="850" y="727" width="380" height="20" fill="#fff" opacity=".95"/><text x="1040" y="742" text-anchor="middle" font-size="14" fill="#25343b">create QuestAttempt (IN_PROGRESS)</text><line class="msg" x1="1220" y1="830" x2="1580" y2="830"/><path d="M1570,824 L1580,830 L1570,836 Z" fill="#345b4d"/><rect x="1210" y="807" width="380" height="20" fill="#fff" opacity=".95"/><text x="1400" y="822" text-anchor="middle" font-size="14" fill="#25343b">INSERT QuestAttempt</text><line class="reply" x1="1580" y1="900" x2="1220" y2="900"/><path d="M1228,895 L1220,900 L1228,905" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="1210" y="877" width="380" height="20" fill="#fff" opacity=".95"/><text x="1400" y="892" text-anchor="middle" font-size="14" fill="#25343b">Created attempt: id, startedAt, status</text><line class="reply" x1="1220" y1="970" x2="860" y2="970"/><path d="M868,965 L860,970 L868,975" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="850" y="947" width="380" height="20" fill="#fff" opacity=".95"/><text x="1040" y="962" text-anchor="middle" font-size="14" fill="#25343b">QuestAttempt</text><line class="reply" x1="860" y1="1035" x2="500" y2="1035"/><path d="M508,1030 L500,1035 L508,1040" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="490" y="1012" width="380" height="20" fill="#fff" opacity=".95"/><text x="680" y="1027" text-anchor="middle" font-size="14" fill="#25343b">Return attempt and quest content</text><line class="reply" x1="500" y1="1080" x2="140" y2="1080"/><path d="M148,1075 L140,1080 L148,1085" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="130" y="1057" width="380" height="20" fill="#fff" opacity=".95"/><text x="320" y="1072" text-anchor="middle" font-size="14" fill="#25343b">Display the assignment</text><line x1="525" y1="1110" x2="1740" y2="1110" stroke="#aab7b2" stroke-dasharray="5 5"/><text x="535" y="1134" font-family="Arial, sans-serif" font-size="13" fill="#25343b" font-weight="bold">else [student or quest not found]</text><line class="reply" x1="860" y1="1168" x2="500" y2="1168"/><path d="M508,1163 L500,1168 L508,1173" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="490" y="1145" width="380" height="20" fill="#fff"/><text x="680" y="1160" text-anchor="middle" font-size="14" fill="#25343b">Not-found error</text><line class="reply" x1="500" y1="1200" x2="140" y2="1200"/><path d="M148,1195 L140,1200 L148,1205" fill="none" stroke="#71817b" stroke-width="1.8"/><rect x="130" y="1177" width="380" height="20" fill="#fff"/><text x="320" y="1192" text-anchor="middle" font-size="14" fill="#25343b">Display error; do not start quiz</text><rect x="45" y="1235" width="1710" height="42" rx="5" fill="#f4f7f6" stroke="#d3ded9"/><text x="60" y="1262" font-family="Arial, sans-serif" font-size="13" fill="#374c45" font-weight="normal">Persistence: QuestAttempt.studentId and questId are required foreign keys; status defaults to IN_PROGRESS and startedAt to now().</text></svg>