<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First quest · Git Good</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
<div class="stage"><div class="device"><div class="screen">
  <header class="appbar tall">
    <div class="row"><a class="back" href="skills.html" data-back>‹</a><div class="steps grow"><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
    <h1 style="margin-top:14px">Your first quest</h1>
    <p class="sub">Step 3 of 3 · Quick, easy and totally skippable</p>
  </header>

  <div class="content">
    <div class="card cream center pop-in">
      <div style="font-size:64px;line-height:1.1" id="quest-icon"></div>
      <span class="pill gold" style="margin-top:6px" id="quest-tag"></span>
      <h2 style="margin:8px 0 4px;font-size:22px">A customer needs your help!</h2>
      <p class="muted small">Every Git Good quest is a real-world request — not an exam.</p>
    </div>

    <div class="speaker rise">
      <div class="avatar lg who" id="speaker-icon"></div>
      <div class="bubble cream"><b class="name" id="speaker-name"></b><span id="quest-story"></span></div>
    </div>

    <div class="card flat rise">
      <h3 style="font-size:15px;margin-bottom:8px">Summary</h3>
      <div class="stack small">
        <div class="row"><span>🎯</span><span id="quest-summary"></span></div>
        <div class="row"><span>⏱️</span><span id="quest-time"></span></div>
        <div class="row"><span>🎁</span><span id="quest-reward"></span></div>
      </div>
    </div>

    <a class="btn btn-primary btn-block pulse" href="exercise.html" id="get-started">Get started</a>
    <a class="btn btn-text btn-block" href="home.html" id="skip">Skip this quiz</a>
  </div>
</div></div></div>

<script src="js/data.js?v=10"></script>
<script src="js/app.js?v=10"></script>
<script>
  const qid = firstQuestFor(GG.state.skills);
  const quest = QUESTS[qid];
  const blanks = quest.answers.length;
  const minutes = quest.minutes;
  document.title = `${quest.title} · Git Good`;
  GG.$("#quest-icon").textContent = quest.icon;
  GG.$("#quest-tag").textContent = `INTRO · ${quest.skill.toUpperCase()}`;
  GG.$("#speaker-icon").textContent = quest.speaker.who;
  GG.$("#speaker-name").textContent = `${quest.speaker.name} · ${quest.speaker.role}`;
  GG.$("#quest-story").textContent = `“${quest.story}”`;
  GG.$("#quest-summary").textContent = `Complete ${blanks} short ${quest.skill} exercise blank${blanks === 1 ? "" : "s"}`;
  GG.$("#quest-time").textContent = `About ${minutes} minutes · ${quest.level}`;
  GG.$("#quest-reward").textContent = `+${quest.xp} XP, your first badge and a mystery chest`;
  GG.$("#get-started").href = `exercise.html?q=${encodeURIComponent(qid)}`;
  GG.$("#skip").addEventListener("click", () => { try { sessionStorage.setItem("gg-skipped", "1"); } catch { /* ignore */ } });
</script>
</body>
</html>
