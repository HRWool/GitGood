<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home · Git Good</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=10">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body data-tab="home">
<div class="stage"><div class="device"><div class="screen">
  <header class="appbar tall">
    <div class="row">
      <a href="profile.html" id="me-av"></a>
      <div class="grow">
        <h1 style="font-size:20px" id="hello"></h1>
      </div>
      <div class="stat-pills">
        <a class="stat-pill flame" href="#streak"><span class="flame">🔥</span><span id="sp-streak"></span></a>
      </div>
    </div>
    <div class="row small" style="margin-top:14px;font-weight:800">
      <span id="lvl-label"></span><span class="grow"></span><span id="lvl-xp"></span>
    </div>
    <div class="bar gold on-dark" style="margin-top:6px"><span id="lvl-bar"></span></div>
  </header>

  <div class="content" id="content"></div>
</div></div></div>

<script src="js/data.js?v=8"></script>
<script src="js/app.js?v=8"></script>
<script>
  const { $, state } = GG;
  const lvl = GG.level();
  const h = new Date().getHours();
  const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  $("#hello").textContent = `${greet}, ${GG.firstName()} 👋`;
  $("#me-av").innerHTML = GG.avatarHTML(state.avatar, "lg");
  $("#sp-streak").textContent = state.streak;
  $("#lvl-label").textContent = `Level ${lvl.n}`;
  $("#lvl-xp").textContent = `${lvl.into} / ${lvl.need} XP`;
  $("#lvl-bar").dataset.w = lvl.pct;

  const done = GG.doneDaily();
  const anyToday = state.doneToday.length > 0;
  const nextQ = DAILY.find((q) => !state.doneToday.includes(q)) || DAILY[0];
  const firstQuest = state.fresh && !state.earned.includes("hello-world");
  const focusQuest = firstQuest ? QUESTS.first : done < DAILY.length ? QUESTS[nextQ] : null;
  const days = ["M", "T", "W", "T", "F", "S", "S"];
  const cls = CLASSES.find((c) => c.id === state.joinedClass);
  const lbRows = GG.ranked(LB_APP, state.xp);
  const me = lbRows.find((r) => r.me);
  const above = lbRows[me.rank - 2];
  const parts = [];

  if (anyToday) {
    parts.push(`<div class="banner good rise dashboard-secured" role="status">
      <span class="bi" aria-hidden="true">✓</span>
      <span class="grow"><b>Streak secured for today!</b><br><span class="small">${done < DAILY.length ? `${DAILY.length - done} more daily quest${DAILY.length - done === 1 ? "" : "s"} for the bonus chest.` : "All daily quests complete — great work!"}</span></span>
    </div>`);
  }

  parts.push(`<section class="dashboard-streak card rise" id="streak" aria-label="Streak progress">
    <div class="card-h"><h2><span class="flame">🔥</span> ${state.streak}-day streak</h2><span class="pill sky">🧊 ${state.freezes} freeze${state.freezes === 1 ? "" : "s"}</span></div>
    <div class="week">${days.map((d, i) => {
      const c = state.week[i] ? "hit" : i === 6 ? "today" : "";
      return `<div class="d ${c}"><i>${state.week[i] ? "✓" : i === 6 ? "!" : ""}</i>${d}</div>`;
    }).join("")}</div>
    <p class="small muted dashboard-streak-note">${state.streak >= 7 ? "Longest streak ever — keep going for 30! 🌋" : state.streak > 0 ? `${7 - state.streak} more day${state.streak === 6 ? "" : "s"} to unlock the 7-Day Streak badge ⚡` : "Complete a quest today to start your streak."}</p>
  </section>`);

  parts.push(`<section class="dashboard-focus card rise" aria-labelledby="focus-title">
    <div class="card-h">
      <div><div class="dashboard-eyebrow">TODAY'S FOCUS</div><h2 id="focus-title">${focusQuest ? focusQuest.title : "Daily goal complete"}</h2></div>
      <div class="ring" data-p="${Math.round(done / DAILY.length * 100)}" style="--size:54px"><div>${done}/${DAILY.length}<small>daily</small></div></div>
    </div>
    <p class="small muted">${focusQuest ? `${focusQuest.skill} · ~${focusQuest.minutes} min · +${focusQuest.xp} XP` : "All three daily quests are complete. Great work!"}</p>
    ${focusQuest ? `<a class="btn btn-primary btn-block dashboard-primary" href="${firstQuest ? "quiz-intro.html" : `exercise.html?q=${nextQ}`}">${firstQuest ? "Start your first quest" : "Start quest"} <span aria-hidden="true">→</span></a>` : ""}
    ${!anyToday && state.streak > 0 ? `<p class="dashboard-nudge">Complete a quest today to keep your ${state.streak}-day streak.</p>` : ""}
  </section>`);

  const otherDaily = DAILY.filter((id) => !focusQuest || firstQuest || id !== nextQ);
  parts.push(`<details class="dashboard-details card rise">
    <summary><span>${focusQuest && !firstQuest ? "Other daily quests" : "Today's daily quests"}</span><span class="dashboard-toggle" aria-hidden="true"></span></summary>
    <div class="dashboard-quest-list">${otherDaily.map((id) => {
      const q = QUESTS[id], isDone = state.doneToday.includes(id);
      return isDone ? `<div class="dashboard-quest done">
        <span class="qi">✓</span>
        <span class="grow"><b>${q.title}</b><small>${q.skill} · ~${q.minutes} min · +${q.xp} XP</small></span>
        <span class="pill green">Done</span>
      </div>` : `<a class="dashboard-quest" href="exercise.html?q=${id}">
        <span class="qi">${q.icon}</span>
        <span class="grow"><b>${q.title}</b><small>${q.skill} · ~${q.minutes} min · +${q.xp} XP</small></span>
        <span aria-hidden="true">›</span>
      </a>`;
    }).join("")}</div>
  </details>`);

  parts.push(`<details class="dashboard-details dashboard-explore card rise">
    <summary><span>Explore more</span><span class="dashboard-toggle" aria-hidden="true"></span></summary>
    <div class="dashboard-explore-content">
      <a class="dashboard-explore-link" href="profile.html#path"><span class="dashboard-explore-icon">🧭</span><span class="grow"><b>Learning path · Python</b><small>9 of 15 lessons · Continue with Loops</small></span><span aria-hidden="true">›</span></a>
      ${cls ? `<a class="dashboard-explore-link" href="class.html?c=${cls.id}"><span class="dashboard-explore-icon">🎓</span><span class="grow"><b>${cls.name}</b><small>${cls.topic} · ${state.classDone.length} of 3 quests</small></span><span aria-hidden="true">›</span></a>` : `<a class="dashboard-explore-link" href="classes.html"><span class="dashboard-explore-icon">🎓</span><span class="grow"><b>Join a seasonal classroom</b><small>Get a class recommendation based on your skills</small></span><span aria-hidden="true">›</span></a>`}
      <a class="dashboard-explore-link" href="leaderboard.html"><span class="dashboard-explore-icon">🏆</span><span class="grow"><b>Leaderboard · #${me.rank} this week</b><small>${above ? `${above.xp - state.xp} XP to pass ${above.name.split(" ")[0]}` : "You're on top!"}</small></span><span aria-hidden="true">›</span></a>
      <div class="dashboard-community">
        <div class="card-h"><h3>Happening at UNCC</h3><span class="pill green">● live</span></div>
        <div class="feed">${FEED.map(([av, n, t]) => `<div class="item">${GG.avatarHTML(av, "sm")}<span><b>${n}</b> ${t}</span></div>`).join("")}</div>
      </div>
    </div>
  </details>`);

  $("#content").innerHTML = parts.join("");
</script>
</body>
</html>
